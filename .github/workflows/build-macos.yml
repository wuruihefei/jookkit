# macOS arm64 自包含包:Qt6 编译 .app + macdeployqt + 内置 arm64 JRE17 + 后端 jar
# 触发:手动(workflow_dispatch)或推 v* 标签;产物为 Actions Artifact
name: build-macos-arm64

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建后端 fat jar
        run: cd backend && mvn -q package -DskipTests

      - name: 安装 Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          cache: true

      - name: 编译前端 (.app)
        run: |
          cd frontend
          qmake jookkit.pro
          make -j3

      - name: 打包 .app(Qt 框架 + JRE + jar)+ zip
        run: |
          cd frontend
          APP=jookkit.app
          test -d "$APP"
          macdeployqt "$APP"

          # 内置 arm64 JRE17(取 Contents/Home 平铺为 Resources/jre)
          curl -sL -o jre.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/17/ga/mac/aarch64/jre/hotspot/normal/eclipse"
          mkdir jreroot && tar -xzf jre.tar.gz -C jreroot
          JRE_HOME=$(ls -d jreroot/*/Contents/Home)
          mkdir -p "$APP/Contents/Resources/jre"
          cp -R "$JRE_HOME/." "$APP/Contents/Resources/jre/"

          mkdir -p "$APP/Contents/Resources/backend"
          cp ../backend/target/jookkit-backend.jar "$APP/Contents/Resources/backend/"

          # ad-hoc 签名:arm64 macOS 拒绝运行完全未签名的二进制
          codesign --force --deep -s - "$APP"

          {
            echo 'JookKit (macOS Apple Silicon) —— 已内置 Java 运行时,无需安装 Java。'
            echo '首次打开:本应用未经 Apple 公证,直接双击会被拦截。'
            echo '  方法一:右键点击 jookkit.app → 打开 → 再点"打开"。'
            echo '  方法二:终端执行  xattr -cr jookkit.app  后正常双击。'
            echo '仅供测试验证。'
          } > 使用说明.txt
          mkdir -p dist-mac/JookKit
          cp -R "$APP" 使用说明.txt dist-mac/JookKit/
          cd dist-mac && ditto -c -k --keepParent JookKit JookKit-mac-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: JookKit-mac-arm64
          path: frontend/dist-mac/JookKit-mac-arm64.zip
